<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <title>标签 - Zhou Yue 嵌入式博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">

    <!-- ★ 代码高亮: highlight.js (浅色主题, 自定义背景适应明/暗) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css" id="hljs-theme-light">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css" id="hljs-theme-dark" disabled>
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/highlight.min.js"></script>

    <!-- ★ 图表: Mermaid -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>

    <!-- ★ 背景粒子特效: tsparticles -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.10.0/tsparticles.bundle.min.js"></script>

    <!-- ★ 主题切换 - highlight.js 同步 -->
    <script>
        function syncHljsTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            const light = document.getElementById('hljs-theme-light');
            const dark = document.getElementById('hljs-theme-dark');
            if (light) light.disabled = isDark;
            if (dark) dark.disabled = !isDark;
        }
        syncHljsTheme();
        document.addEventListener('themeChanged', syncHljsTheme);
    </script>

    <!-- ★ 初始化 -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            hljs.highlightAll();
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            mermaid.initialize({ startOnLoad: true, theme: isDark ? 'dark' : 'default' });
        });
    </script>
</head>
<body>
    <div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;"></div>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                <i class="bi bi-cpu"></i> Zhou Yue 嵌入式博客
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-house"></i> 首页</a>
                    <li class="nav-item"><a class="nav-link" href="timeline.html"><i class="bi bi-clock-history"></i> 时间线</a></li></li>
                    <li class="nav-item"><a class="nav-link" href="archive.html"><i class="bi bi-archive"></i> 归档</a></li>
                    <li class="nav-item"><a class="nav-link active" href="tags.html"><i class="bi bi-tags"></i> 标签</a></li>
                    <li class="nav-item"><a class="nav-link" href="search.html"><i class="bi bi-search"></i> 搜索</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html"><i class="bi bi-person"></i> 关于</a></li>
                </ul>
                <button id="theme-toggle" class="btn btn-outline-secondary btn-sm ms-2"><i class="bi bi-moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <h1 class="mb-4"><i class="bi bi-tags"></i> 文章标签</h1>
        <p class="text-secondary mb-4">按字母顺序浏览所有标签</p>

        <div id="tags-cloud" class="mb-4">
            <div class="text-secondary">加载中...</div>
        </div>

        <hr class="my-4">

        <div id="tag-posts">
            <h2 id="tag-title" class="h4 mb-3">所有文章</h2>
            <div id="tag-posts-list">
                <p class="text-secondary">点击上方标签查看相关文章</p>
            </div>
        </div>
    </main>

    <footer class="bg-body-tertiary border-top mt-5 py-4">
        <div class="container text-center text-secondary">
            © 2026 Zhou Yue · 用 <i class="bi bi-heart-fill text-danger"></i> 和 <i class="bi bi-tools"></i> 写
        </div>
    </footer>

    <script>
        const POSTS = [
            {
                "url": "posts/2026-09-23-rp2350-winusb.html",
                "title": "RP2350 WINUSB 自动装驱动 — 完整实战方案",
                "date": "2026-09-23",
                "tags": ["RP2350", "Pico 2", "WINUSB", "TinyUSB", "USB", "Embedded"],
                "description": "在 RP2350 / Raspberry Pi Pico 2 上实现 USB vendor class 设备，让 Windows 自动识别并安装 WinUSB.sys 驱动，无需 Zadig、无需 .inf 文件。"
            }
        ];

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function getAllTags() {
            const tagMap = {};
            POSTS.forEach(p => {
                (p.tags || []).forEach(t => {
                    tagMap[t] = (tagMap[t] || 0) + 1;
                });
            });
            return Object.entries(tagMap).sort((a, b) => a[0].localeCompare(b[0]));
        }

        function renderTagsCloud() {
            const cloud = document.getElementById('tags-cloud');
            if (!cloud) return;

            const tags = getAllTags();
            cloud.innerHTML = tags.map(([tag, count]) => `
                <a href="#${encodeURIComponent(tag)}"
                   class="badge text-bg-primary text-decoration-none me-1 mb-1"
                   style="font-size: ${1 + count * 0.1}em;">
                    ${escapeHtml(tag)} <span class="badge text-bg-light">${count}</span>
                </a>
            `).join('');
        }

        function renderTagPosts(tag) {
            const titleEl = document.getElementById('tag-title');
            const listEl = document.getElementById('tag-posts-list');
            if (!titleEl || !listEl) return;

            if (!tag) {
                titleEl.innerHTML = '<i class="bi bi-collection"></i> 所有文章';
                listEl.innerHTML = POSTS.map(p => renderPostCard(p)).join('');
                return;
            }

            const filtered = POSTS.filter(p => (p.tags || []).includes(tag));
            titleEl.innerHTML = `<i class="bi bi-tag"></i> 标签: ${escapeHtml(tag)} <span class="badge text-bg-secondary">${filtered.length}</span>`;

            if (filtered.length === 0) {
                listEl.innerHTML = '<p class="text-secondary">该标签下暂无文章</p>';
                return;
            }

            listEl.innerHTML = filtered.map(p => renderPostCard(p)).join('');
        }

        function renderPostCard(p) {
            return `
                <article class="card mb-3 shadow-sm">
                    <div class="card-body">
                        <time class="text-secondary small">
                            <i class="bi bi-calendar3"></i> ${p.date}
                        </time>
                        <h3 class="card-title h5 mt-2 mb-2">
                            <a href="${p.url}" class="text-decoration-none stretched-link">${escapeHtml(p.title)}</a>
                        </h3>
                        <p class="card-text text-secondary">${escapeHtml(p.description || '')}</p>
                    </div>
                </article>
            `;
        }

        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('badge') && e.target.getAttribute('href')?.startsWith('#')) {
                e.preventDefault();
                const tag = decodeURIComponent(e.target.getAttribute('href').slice(1));
                history.pushState({}, '', `#${encodeURIComponent(tag)}`);
                renderTagPosts(tag);
                window.scrollTo({ top: document.getElementById('tag-posts').offsetTop - 80, behavior: 'smooth' });
            }
        });

        window.addEventListener('load', () => {
            renderTagsCloud();
            const hash = window.location.hash.slice(1);
            if (hash) renderTagPosts(decodeURIComponent(hash));
            else renderTagPosts(null);
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/particles.js"></script>
    <script src="assets/theme.js"></script>
    <script src="assets/enhance.js"></script>
</body>
</html>
