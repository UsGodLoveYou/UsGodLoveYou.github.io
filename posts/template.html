<!DOCTYPE html>
<!--
  ============================================================
  Template: 文章模板 (Bootstrap 5)
  ============================================================
  使用方法:
    1. 复制本文为 posts/YYYY-MM-DD-标题.html
    2. 修改 <title> 和 <h1>
    3. 修改 <time> 日期
    4. 修改标签 <span class="badge">
    5. 写正文 (放在 <article> 里)
    6. ★ 更新 data/posts.json + 所有静态页面 POSTS 数组
  ============================================================
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你的标题 - Zhou Yue 嵌入式博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <!-- ★ Bootstrap 导航栏 (复制此 nav 到每篇文章) -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-cpu"></i> Zhou Yue 嵌入式博客
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html"><i class="bi bi-house"></i> 首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="../archive.html"><i class="bi bi-archive"></i> 归档</a></li>
                    <li class="nav-item"><a class="nav-link" href="../tags.html"><i class="bi bi-tags"></i> 标签</a></li>
                    <li class="nav-item"><a class="nav-link" href="../search.html"><i class="bi bi-search"></i> 搜索</a></li>
                    <li class="nav-item"><a class="nav-link" href="../about.html"><i class="bi bi-person"></i> 关于</a></li>
                </ul>
                <button id="theme-toggle" class="btn btn-outline-secondary btn-sm ms-2"><i class="bi bi-moon"></i></button>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <article class="post-content">
            <header class="mb-4 pb-3 border-bottom">
                    <time class="text-secondary small">
                        <i class="bi bi-calendar3"></i> 2026-XX-XX
                    </time>
                    <h1 class="mt-2">你的标题</h1>
                    <div class="post-tags mt-2">
                        <span class="badge text-bg-secondary">标签1</span>
                        <span class="badge text-bg-secondary">标签2</span>
                    </div>
                </header>

            <!-- ============================================
                 ★ 正文区域 ★
                 直接写 HTML, 用 Bootstrap classes:
                 h2 / h3, p, ul, code/pre, table, blockquote
                 ============================================ -->

            <h2>第一部分</h2>
            <p>段落文字</p>
            <ul>
                <li>列表项 1</li>
                <li>列表项 2</li>
            </ul>

            <h3>子标题</h3>
            <pre><code class="language-c">// 代码块
int main() {
    return 0;
}</code></pre>

            <table class="table table-bordered">
                <thead>
                    <tr><th>列 1</th><th>列 2</th></tr>
                </thead>
                <tbody>
                    <tr><td>值 1</td><td>值 2</td></tr>
                </tbody>
            </table>

            <blockquote class="border-start ps-3 text-secondary">
                <p>引用块</p>
            </blockquote>

            <!-- alert / badge / button 等 Bootstrap 组件也可以用 -->
            <div class="alert alert-info my-3">
                <i class="bi bi-info-circle"></i> 提示: 用 alert 强调重点
            </div>

        </article>

        <!-- ★ 自动 "上一篇 / 下一篇" 导航 ★ -->
        <div id="post-nav-container"></div>
    </main>

    <footer class="bg-body-tertiary border-top mt-5 py-4">
        <div class="container text-center text-secondary">
            © 2026 Zhou Yue · 用 <i class="bi bi-heart-fill text-danger"></i> 和 <i class="bi bi-tools"></i> 写
        </div>
    </footer>

    <!-- Bootstrap JS + 我们的 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/theme.js"></script>
    <script src="../assets/nav.js"></script>
</body>
</html>
